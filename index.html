<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conway's Game of Life</title>
<style>
  :root {
    --bg: #f3f5f2; --panel: #e4e9e3; --ink: #1c2a22; --muted: #5d6e63;
    --cell: #1f6f4a; --grid: rgba(28,42,34,.07); --line: #c3ccc4; --accent: #1f6f4a; --accent-ink: #fff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101713; --panel: #19231d; --ink: #dfe9e2; --muted: #8fa396;
      --cell: #7be0a4; --grid: rgba(223,233,226,.06); --line: #2b3a31; --accent: #7be0a4; --accent-ink: #0d1510;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 12px;
  }
  h1 { font-size: 1.15rem; margin: 0; font-weight: 600; }
  .stats { color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--ink); font-weight: 600; }
  #wrap { width: 100%; max-width: 1000px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
  canvas { display: block; width: 100%; background: var(--bg); cursor: crosshair; image-rendering: pixelated; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; justify-content: center; max-width: 1000px; }
  label { display: flex; flex-direction: column; gap: 2px; font-size: .8rem; color: var(--muted); }
  input[type=number] { width: 80px; }
  input, button {
    font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
    border-radius: 4px; padding: 5px 9px;
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; min-width: 84px; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { color: var(--muted); font-size: .8rem; margin: 0; text-align: center; }
</style>
</head>
<body>
  <h1>Conway's Game of Life</h1>
  <div class="stats">Gen <b id="gen">0</b> &nbsp; Pop <b id="pop">0</b> &nbsp; <span id="status"></span></div>
  <div id="wrap"><canvas id="c"></canvas></div>

  <div class="bar">
    <button id="play" class="primary">Pause</button>
    <button id="stepBtn">Step</button>
    <label>Speed (ms/gen)<input id="speed" type="range" min="10" max="500" value="80"></label>
    <label>Width<input id="w" type="number" min="4" max="300" value="80"></label>
    <label>Height<input id="h" type="number" min="4" max="300" value="40"></label>
    <label>Steps (0 = forever)<input id="steps" type="number" min="0" value="0"></label>
    <label>Seed<input id="seed" type="number" value="42"></label>
    <button id="reset">Reset</button>
    <button id="clear">Clear</button>
  </div>
  <p class="hint">Click or drag on the grid to toggle cells. Edges wrap around (toroidal grid).</p>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('c'), ctx = canvas.getContext('2d');
  let W, H, cur, next, gen = 0, steps = 0, running = true, last = 0, timer = 0;

  // Seeded RNG (mulberry32) — replaces C's srand/rand
  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const wrap = (v, max) => (v + max) % max;

  function stamp(offsets, cx, cy) {
    for (let i = 0; i < offsets.length; i += 2)
      cur[wrap(cy + offsets[i + 1], H) * W + wrap(cx + offsets[i], W)] = 1;
  }

  function seedGrid(seed) {
    const rand = rng(seed);
    for (let i = 0; i < W * H; i++) cur[i] = rand() < 0.30 ? 1 : 0;
    stamp([1,0, 2,1, 0,2, 1,2, 2,2], 3, 3);                       // glider
    stamp([1,0, 2,0, 0,1, 1,1, 1,2], W >> 1, H >> 1);              // R-pentomino
  }

  function neighbours(x, y) {
    let n = 0;
    for (let dy = -1; dy <= 1; dy++)
      for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        n += cur[wrap(y + dy, H) * W + wrap(x + dx, W)];
      }
    return n;
  }

  function step() {
    for (let y = 0; y < H; y++)
      for (let x = 0; x < W; x++) {
        const n = neighbours(x, y), i = y * W + x;
        next[i] = cur[i] ? (n === 2 || n === 3 ? 1 : 0) : (n === 3 ? 1 : 0);
      }
    [cur, next] = [next, cur];
    gen++;
  }

  function population() { let c = 0; for (let i = 0; i < W * H; i++) c += cur[i]; return c; }

  function draw() {
    const dpr = window.devicePixelRatio || 1;
    const cssW = canvas.clientWidth, cs = cssW / W;
    const cssH = cs * H;
    canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    const s = canvas.width / W, st = getComputedStyle(document.documentElement);
    ctx.fillStyle = st.getPropertyValue('--bg'); ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = st.getPropertyValue('--cell');
    const gap = s > 6 ? 1 : 0;
    for (let y = 0; y < H; y++)
      for (let x = 0; x < W; x++)
        if (cur[y * W + x]) ctx.fillRect(x * s + gap, y * s + gap, s - gap * 2, s - gap * 2);
    $('gen').textContent = gen;
    $('pop').textContent = population();
    $('status').textContent = running ? '' : (steps && gen > steps ? 'Done' : 'Paused');
  }

  function init(fresh) {
    W = Math.max(4, Math.min(300, +$('w').value || 80));
    H = Math.max(4, Math.min(300, +$('h').value || 40));
    steps = Math.max(0, +$('steps').value || 0);
    cur = new Uint8Array(W * H); next = new Uint8Array(W * H);
    gen = 0;
    if (fresh) seedGrid(+$('seed').value || 0);
    draw();
  }

  function setRunning(r) { running = r; $('play').textContent = r ? 'Pause' : 'Play'; draw(); }

  function loop(t) {
    if (running && t - last >= +$('speed').value) {
      last = t;
      if (steps && gen >= steps) setRunning(false);   // matches C: runs generations 0..steps
      else { step(); draw(); }
    }
    requestAnimationFrame(loop);
  }

  $('play').onclick = () => {
    if (!running && steps && gen >= steps) { gen = 0; seedGrid(+$('seed').value || 0); }
    setRunning(!running);
  };
  $('stepBtn').onclick = () => { setRunning(false); step(); draw(); };
  $('reset').onclick = () => { init(true); setRunning(true); };
  $('clear').onclick = () => { cur.fill(0); gen = 0; setRunning(false); };
  ['w', 'h', 'steps'].forEach(id => $(id).onchange = () => { init(true); });
  $('seed').onchange = () => { init(true); };

  // Paint cells with mouse/touch
  let painting = null;
  function cellAt(e) {
    const r = canvas.getBoundingClientRect();
    const x = Math.floor((e.clientX - r.left) / r.width * W), y = Math.floor((e.clientY - r.top) / r.height * H);
    return (x >= 0 && y >= 0 && x < W && y < H) ? y * W + x : -1;
  }
  canvas.addEventListener('pointerdown', e => {
    const i = cellAt(e); if (i < 0) return;
    painting = cur[i] ? 0 : 1; cur[i] = painting; canvas.setPointerCapture(e.pointerId); draw();
  });
  canvas.addEventListener('pointermove', e => {
    if (painting === null) return;
    const i = cellAt(e); if (i >= 0 && cur[i] !== painting) { cur[i] = painting; draw(); }
  });
  canvas.addEventListener('pointerup', () => painting = null);
  window.addEventListener('resize', draw);

  init(true);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
